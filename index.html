<style>/* ============================================================================
   styles.css — the design system, and nothing else.
   Colours sampled from the family emblem. One accent, no gradients.
   ============================================================================ */

:root{
  color-scheme: light only;
  --ink:#2F1911; --oxblood:#8F2502; --paper:#EFEDE8; --card:#FBFAF7;
  --rule:#DCD6CD; --muted:#7A6C64;
  --fa:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  --naskh:'Noto Naskh Arabic',Tahoma,serif;
  --r:3px;
  --girih:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 6'><path d='M0,3 L6,0 L12,3 L18,0 L24,3' stroke='black' fill='none' stroke-width='1'/><path d='M0,3 L6,6 L12,3 L18,6 L24,3' stroke='black' fill='none' stroke-width='1'/></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{color-scheme:light only;background:var(--paper);color:var(--ink);
  font-family:var(--fa);font-weight:300;font-size:15px;line-height:1.7;
  direction:rtl;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oxblood);outline-offset:2px}

/* ---- header: two controls, never more ---------------------------------- */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 20px}
.top .emb{height:34px;flex:none}
.who{flex:1;min-width:0;text-align:right;padding:2px}
.who small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.who b{font-size:14px;font-weight:600}
.tb{font-size:13px;font-weight:600;color:var(--oxblood);white-space:nowrap;
  padding:6px 2px;min-height:44px}

.app{max-width:520px;margin:0 auto;padding:0 0 72px}

/* ---- person head -------------------------------------------------------- */
.head{padding:34px 24px 0;text-align:center}
.gen{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.name{font-size:clamp(32px,9vw,50px);font-weight:800;line-height:1.15;margin-top:8px}
.rel{font-size:19px;color:var(--oxblood);font-weight:600;margin-top:10px}

/* ---- lens: two exactly equal halves, divider drawn as the grid gap ------- */
.lens{display:grid;grid-template-columns:1fr 1fr;gap:1px;width:230px;
  margin:18px auto 26px;background:var(--rule);border:1px solid var(--rule);
  border-radius:var(--r);overflow:hidden}
.lens>button{width:100%;background:var(--paper);min-height:48px;padding:7px 6px 5px;
  font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;border-bottom:2px solid transparent}
.lens .lg{width:15px;height:19px;display:block}
.lens .lg svg{width:100%;height:100%;display:block;opacity:.55}
.lens>button[aria-current="true"]{background:var(--card);color:var(--oxblood);
  border-bottom-color:var(--oxblood)}
.lens>button[aria-current="true"] .lg svg{opacity:1}

/* ---- portrait ----------------------------------------------------------- */
.portrait{display:flex;justify-content:center;margin:0 0 8px}
.shield{position:relative;width:172px;height:216px}
.shield svg.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shield .fill{position:absolute;inset:9px;background:var(--card);overflow:hidden;
  -webkit-clip-path:url(#shieldClip);clip-path:url(#shieldClip);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.shield .fill img{width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) sepia(.35) saturate(.8) contrast(1.03);
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  pointer-events:none}
.initial{font-family:var(--naskh);font-size:52px;color:var(--oxblood);opacity:.45;line-height:1}
.emblem-big{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 8px}
.emblem-big img{width:168px;height:auto}
.emblem-big span{font-size:13px;color:var(--muted);font-weight:600}

/* ---- facts, notes, dividers --------------------------------------------- */
.facts{margin:26px 20px 0;background:var(--card);border-radius:var(--r);
  box-shadow:1px 1px 0 0 var(--ink)}
.fact{display:flex;gap:16px;padding:15px 20px;border-bottom:1px solid var(--rule)}
.fact:last-child{border-bottom:0}
.fact dt{flex:0 0 84px;font-size:13px;font-weight:600;color:var(--muted);padding-top:2px}
.fact dd{flex:1;font-size:15px}
.notes{margin:22px 20px 0;padding:18px 20px;border:1px solid var(--rule);border-radius:var(--r)}
.notes p{font-family:var(--naskh);font-size:18px;line-height:1.9}

/* ---- documents (اسناد) -------------------------------------------------- */
.docs{margin:22px 20px 0}
.docs .dhead{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  margin:0 4px 10px}
.docs .dlist{display:flex;flex-direction:column;gap:0;background:var(--card);
  border:1px solid var(--rule);border-radius:var(--r);box-shadow:1px 1px 0 0 var(--ink);
  overflow:hidden}
.docs .drow{display:flex;align-items:baseline;gap:12px;width:100%;text-align:right;
  padding:14px 16px;border-bottom:1px solid var(--rule);background:transparent;cursor:pointer;
  min-height:52px}
.docs .drow:last-child{border-bottom:0}
.docs .drow:hover .dtitle{color:var(--oxblood)}
.docs .dkind{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--oxblood)}
.docs .dtitle{flex:1;font-size:15px;line-height:1.6}
.docs .dyear{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--muted)}

.docview{position:fixed;inset:0;z-index:60;background:rgba(47,25,17,.92);display:none;
  align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.docview.on{display:flex}
.docview .dv-close{position:absolute;top:max(12px,env(safe-area-inset-top));inset-inline-end:16px;
  width:44px;height:44px;font-size:28px;line-height:1;color:#fff;opacity:.9;z-index:1}
.docview img{max-width:100%;max-height:100%;object-fit:contain;border-radius:2px;
  -webkit-touch-callout:none;user-select:none;pointer-events:none}

.girih{height:6px;margin:30px 0;background-color:var(--rule);opacity:.55;
  -webkit-mask-image:var(--girih);mask-image:var(--girih);
  -webkit-mask-repeat:repeat-x;mask-repeat:repeat-x;
  -webkit-mask-size:24px 6px;mask-size:24px 6px}

/* ---- groups -------------------------------------------------------------- */
.groups{margin:0 20px}
.group{border-top:1px solid var(--rule)}
.group:last-child{border-bottom:1px solid var(--rule)}
.ghead{width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:14px 4px;font-size:18px;font-weight:600;text-align:right}
.gcount{font-size:13px;font-weight:600;color:var(--muted);margin-inline-start:8px}
.chev{width:10px;height:10px;border-inline-start:2px solid var(--oxblood);
  border-bottom:2px solid var(--oxblood);transform:rotate(45deg);transition:transform .15s}
.group[data-open="true"] .chev{transform:rotate(225deg)}
.gbody{display:none;padding-bottom:6px}
.group[data-open="true"] .gbody{display:block}
.row{display:flex;align-items:center;justify-content:space-between;min-height:52px;
  padding:10px 4px;width:100%;text-align:right;border-top:1px solid var(--rule)}
.row.link{cursor:pointer}
.row.link:hover .rname{color:var(--oxblood)}
.row .rn{flex:1;min-width:0}
.rname{font-size:17px}
.rsub{font-size:13px;color:var(--muted);margin-top:2px}
.arrow{width:8px;height:8px;flex:none;
  border-inline-end:2px solid var(--rule);border-top:2px solid var(--rule);transform:rotate(-45deg)}

/* ---- foot links ---------------------------------------------------------- */
.foot{margin:26px 20px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.foot button{color:var(--muted);font-size:13px;font-weight:600;min-height:44px;
  text-decoration:underline;text-underline-offset:3px}
.foot button.accent{color:var(--oxblood)}
.count{font-size:13px;color:var(--muted);min-height:28px}
.crumb{margin:26px 20px 0;padding-top:14px;border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.crumb button{color:var(--muted);font-weight:600;min-height:auto;padding:2px}
.crumb button:hover,.crumb .here{color:var(--oxblood)}
.crumb .sep{color:var(--rule)}

/* ---- tree ---------------------------------------------------------------- */
.tree{padding:0 12px;text-align:center}
.tier{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
/* couple row: person stays on the page centre; sides may overflow their half */
.tier.couple{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:start;justify-items:center;column-gap:14px;width:100%;--person-sh:58px}
.tier.couple:has(>.node.focus){--person-sh:141px}
.tier.couple:has(>.node.down):not(:has(>.node.focus)){--person-sh:80px}
.tier.kids{gap:14px;justify-content:center;width:100%}
.spacer{width:1px}
/* co-wives share one top line; group is dropped so shield mid = person shield mid */
.side{display:flex;align-items:flex-start;justify-content:flex-start;--sh:80px;
  min-width:0;max-width:100%;justify-self:start;
  padding-top:calc((var(--person-sh) - var(--sh)) / 2)}
.side:has(.node.up){--sh:58px}
.side>.node,.side>.bar{flex:none}
.stem{width:1px;height:24px;background:var(--rule);margin:0 auto}
.bar{width:26px;height:5px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  flex:none;margin:calc((var(--sh) - 5px) / 2) 6px 0}
.tlabel{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:20px 0 8px}
.molabel{font-size:12px;font-weight:600;color:var(--oxblood);margin:18px 0 6px;opacity:.85}
.node{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
  max-width:120px;transform-origin:center;will-change:transform}
.node .sh{position:relative}
.node .sh svg{display:block;width:100%;height:100%}
.node .im{position:absolute;inset:6%;background:var(--card);overflow:hidden;
  -webkit-clip-path:url(#shieldClip);clip-path:url(#shieldClip);
  display:flex;align-items:center;justify-content:center}
.node .im img{width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) sepia(.35) saturate(.8) contrast(1.03);
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  pointer-events:none}
.node .nn{font-size:14px;font-weight:600;line-height:1.3}
.node .nr{font-size:11px;color:var(--muted);line-height:1.3}
.node.up .sh{width:46px;height:58px}
.node.up .nn{font-size:13px;font-weight:400}
.node.focus .sh{width:112px;height:141px}
.node.focus .nn{font-size:22px;font-weight:800}
.node.focus .nr{font-size:13px;color:var(--oxblood);font-weight:600}
/* equal slot width so long names don’t pull the child row off the stem */
.node.down{width:76px;max-width:76px}
.node.down .sh{width:64px;height:80px}
.node.down .nn{font-size:13px;font-weight:600;max-width:76px;line-height:1.25;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  word-break:break-word;overflow-wrap:anywhere}
.node.sib{width:48px;max-width:48px}
.node.sib .sh{width:38px;height:48px}
.node.sib .nn{font-size:12px;font-weight:400;max-width:48px;line-height:1.25;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  word-break:break-word;overflow-wrap:anywhere}
.node.sib .nr{display:none}
.node.wed .nn{font-weight:400}
.node.ghost .nn{color:var(--muted);font-weight:400}
/* siblings: up to 4 per row, extra rows stack down; first-row shield mid = person mid */
.sibs{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:flex-start;gap:8px;
  min-width:0;max-width:min(100%,calc(4 * 48px + 3 * 8px));justify-self:end;
  padding-top:calc((var(--person-sh) - 48px) / 2);padding-inline-end:4px}
.sibs:empty{padding-top:0;padding-inline-end:0}

/* ---- نسبت ---------------------------------------------------------------- */
.lead{font-size:13px;color:var(--muted);text-align:center;margin:0 20px}
.tree .lead{margin:6px 20px 22px}
.verdict{font-size:17px;font-weight:600;margin:8px 20px;line-height:1.8;text-align:center}
.verdict .also{display:block;margin-top:6px;font-size:14px;color:var(--oxblood)}
.picks{margin:18px 20px 24px;border-top:1px solid var(--rule)}
.pick{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--rule)}
.pick .no{font-size:12px;font-weight:600;color:var(--oxblood);min-width:18px}
.pick .pn{flex:1;min-width:0;text-align:right;font-size:16px}
.pick .rm{color:var(--muted);font-size:22px;line-height:1;min-height:44px;min-width:44px;padding:0 4px}
.pick .rm:hover{color:var(--oxblood)}
.addp{display:block;margin:14px auto 0;border:1px solid var(--rule);border-radius:var(--r);
  padding:10px 16px;font-size:14px;font-weight:600;color:var(--oxblood);min-height:44px}
.addp[disabled]{color:var(--muted);cursor:default}
.branch{display:flex;flex-direction:column;align-items:center;position:relative;padding-top:18px}
.brow{display:flex;justify-content:center;align-items:flex-start;gap:10px}
.brow>.branch::before{content:'';position:absolute;top:0;right:50%;width:50%;border-top:1px solid var(--rule)}
.brow>.branch::after{content:'';position:absolute;top:0;left:50%;width:50%;border-top:1px solid var(--rule)}
.brow>.branch:first-child::before{display:none}
.brow>.branch:last-child::after{display:none}
.branch>.vstem{position:absolute;top:0;left:50%;width:1px;height:18px;background:var(--rule)}
.tag{font-size:11px;font-weight:600;color:var(--oxblood);border:1.5px solid var(--oxblood);
  border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  margin-bottom:4px}
/* نسبت pick: number tag is the signal. Don't thicken the focus shield stroke —
   on iPhone a 3.2 stroke on the large focus path reads as a broken border. */
.node.chosen:not(.focus) .sh svg path{stroke-width:2.2}
.node.chosen .nn{font-weight:800}

/* ---- finder --------------------------------------------------------------- */
.finder{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto;display:none}
.finder.on{display:block}
.fin{max-width:520px;margin:0 auto;padding:0 16px 40px}
.fhead{position:sticky;top:0;background:var(--paper);padding:12px 0 8px;
  border-bottom:1px solid var(--rule);z-index:2}
.fhead .r1{display:flex;gap:10px;align-items:center}
.fq{flex:1;background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:11px 14px;font-size:16px}
.fclose{color:var(--oxblood);font-weight:400;font-size:26px;line-height:1;min-height:44px;min-width:44px;
  white-space:nowrap;padding:0 4px}
.ftrail{display:flex;flex-wrap:wrap;gap:5px;font-size:13px;color:var(--muted);padding-top:8px}
.ftrail button{color:var(--muted);font-weight:600;padding:2px}
.ftrail .here{color:var(--ink);font-weight:800;border-bottom:2px solid var(--oxblood)}
.ftrail .sep{color:var(--rule)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-top:14px}
.cell{background:var(--paper);min-height:96px;padding:12px 6px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center}
.cell .cg{width:22px;height:28px;opacity:.5}
.cell .cg svg{width:100%;height:100%;display:block}
.cell .cn{font-size:14px;font-weight:600;line-height:1.25}
.cell .cs{font-size:11px;color:var(--muted)}
.cell.picked{background:var(--card)}
.cell .cnum{font-size:11px;font-weight:600;color:var(--oxblood)}
.fill{background:var(--paper)}
.enter{display:block;width:100%;text-align:center;color:var(--oxblood);font-weight:600;
  font-size:14px;min-height:44px;padding:10px;border-bottom:1px solid var(--rule)}
.res{display:block;width:100%;text-align:right;padding:12px 4px;border-bottom:1px solid var(--rule)}
.res .rn2{font-size:16px}
.res .rp{font-size:12px;color:var(--muted);margin-top:2px}
.res.on{background:var(--card)}
.empty{color:var(--muted);padding:18px 4px;font-size:14px}

/* ---- about ---------------------------------------------------------------- */
.about{padding:24px 22px 60px;text-align:center}
.about .mark{display:block;width:118px;margin:0 auto 12px}
.about h2{font-size:19px;font-weight:600;margin:0 0 6px;text-align:center}
.about h3{font-size:15px;font-weight:600;color:var(--oxblood);margin:0 0 10px;text-align:center}
.about p{font-family:var(--naskh);font-size:18px;line-height:1.95;margin-bottom:10px;text-align:justify}
.about section{margin-top:8px}
.marks-key{display:flex;justify-content:center;align-items:flex-start;gap:22px;margin:4px 0 16px}
.marks-item{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px}
.marks-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.marks-icon svg{display:block}
.marks-name{font-size:14px;font-weight:600;color:var(--oxblood)}
.marks-mean{font-size:12px;color:var(--muted);font-weight:600}

/* ---- print ----------------------------------------------------------------- */
.phead,.pfoot{display:none}
@media print{
  @page{size:A4 portrait;margin:16mm 14mm}
  html,body{background:#fff}
  .top,.finder,.docview,.lens,.foot,.addp,.pick .rm{display:none !important}
  .app{padding:0;max-width:none}
  .phead{display:block;text-align:center;margin-bottom:6mm}
  .phead img{width:18mm}
  .phead .t{font-size:9.5pt;color:#7A6C64;margin-top:2mm}
  .pfoot{display:block;text-align:center;font-size:8pt;color:#7A6C64;
    margin-top:6mm;padding-top:2mm;border-top:1px solid #DCD6CD}
  .name{font-size:19pt}.rel{font-size:12pt}
  .head{padding:0 0 6px}
  .shield{width:120px;height:151px}
  .facts,.notes,.docs,.groups,.crumb{margin-inline:0}
  .gbody{display:block !important}
  .node{transform:none !important;opacity:1 !important}
  .node,.row,.fact,.verdict,.branch{break-inside:avoid;page-break-inside:avoid}
  img{filter:grayscale(1) sepia(.35) saturate(.8) contrast(1.03) !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}
</style>

/* ============================================================================
   kinship.js — Persian kinship phrases over the archive.

   Pure: no DOM, no globals beyond what is passed in. Everything the app says
   about how two people are related comes from here.

   The rules are stated in SPEC.md §3. The short version:
     descent is measured by walking both people up to a common ancestor;
     marriage is resolved first, and never enters a descent walk.
   ============================================================================ */

function createKinship(people) {
  const P = people;                              // id -> record

  /* ---- basics ------------------------------------------------------- */
  const nameOf = id => (P[id] && P[id].name) || '؟';

  const isSpouse = id => !!(P[id] && P[id].spouseOf);

  const childrenIndex = {};
  const wivesIndex = {};
  for (const id in P) {
    const r = P[id];
    if (r.parent) (childrenIndex[r.parent] = childrenIndex[r.parent] || []).push(id);
    if (r.spouseOf) (wivesIndex[r.spouseOf] = wivesIndex[r.spouseOf] || []).push(id);
  }
  const childrenOfBlood = id => childrenIndex[id] || [];
  const spousesOf = id => wivesIndex[id] || [];

  /* Ancestor chain, root first. A spouse hangs off her husband's chain: she is
     positioned by the marriage but is never a step in anyone's descent. */
  function chain(id) {
    if (!P[id]) return [];
    if (P[id].spouseOf) return chain(P[id].spouseOf).concat([id]);
    const out = [];
    let c = id, guard = 0;
    while (c && P[c] && guard++ < 30) { out.unshift(c); c = P[c].parent; }
    return out;
  }

  /* Who was this person's mother? Stated wins; otherwise a single recorded
     wife is the mother by elimination. Two or more wives and nothing stated
     stays unknown — the archive would rather say nothing than guess. */
  function motherOf(id) {
    const r = P[id];
    if (!r || r.spouseOf) return null;
    if (r.mother) return r.mother;
    if (!r.parent) return null;
    const w = spousesOf(r.parent);
    return w.length === 1 ? P[w[0]].name : null;
  }

  /* A wife's own children: hers by attribution, or all of them when her
     husband had only one wife. */
  function childrenOf(id) {
    const r = P[id];
    if (!r) return [];
    if (!r.spouseOf) return childrenOfBlood(id);
    return childrenOfBlood(r.spouseOf).filter(k => {
      const m = motherOf(k);
      return m ? m === r.name : false;
    });
  }

  /* ---- Persian morphology -------------------------------------------- */
  const KASRE = '\u0650', ZWNJ = '\u200c';
  /* ezafe, applied exactly once: ends in a vowel letter -> ی, ends in ه -> ‌ی,
     otherwise the kasre. Composing already-ezafe'd parts is how you get
     پدربزرگِِ, so everything funnels through here. */
  /* Idempotent: only the three endings ez itself produces count as "already
     ezafe'd". A plain ی (ناپسری, قدسی) is part of the word and still needs the
     kasre, which is why a simple endsWith('ی') test is wrong. */
  const hasEz = s => s.endsWith(KASRE) || s.endsWith(ZWNJ + 'ی') || /[اوآ]ی$/.test(s);
  function ez(s) {
    if (!s || hasEz(s)) return s;
    if (/[اوآ]$/.test(s)) return s + 'ی';
    if (/ه$/.test(s)) return s + ZWNJ + 'ی';
    return s + KASRE;
  }
  const ORD = ['', 'اول', 'دوم', 'سوم', 'چهارم', 'پنجم', 'ششم', 'هفتم', 'هشتم', 'نهم', 'دهم'];
  const FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
  const fa = n => String(n).replace(/[0-9]/g, d => FA_DIGITS[d]);

  const DESC = ['', 'فرزند', 'نوه', 'نتیجه', 'نبیره', 'ندیده'];
  const descTerm = (k, g) =>
    k === 1 ? (g === 'f' ? 'دختر' : g === 'm' ? 'پسر' : 'فرزند')
      : (DESC[k] || (fa(k) + ' نسل پایین‌تر'));
  /* پدربزرگ counts as جد اول, so جد دوم is his father. Not universal — the
     about screen states which convention this archive uses. */
  const ancTerm = (k, g) =>
    k === 1 ? (g === 'f' ? 'مادر' : 'پدر')
      : k === 2 ? (g === 'f' ? 'مادربزرگ' : 'پدربزرگ')
        : (g === 'f' ? 'جده' : 'جد') + ' ' + (ORD[k - 1] || fa(k - 1) + 'م');
  const uncleTerm = (paternal, g) =>
    paternal ? (g === 'f' ? 'عمه' : 'عمو') : (g === 'f' ? 'خاله' : 'دایی');

  /* ---- blood --------------------------------------------------------- */
  function bloodPhrase(ego, target) {
    const ca = chain(ego), cb = chain(target);
    let i = 0;
    while (i < ca.length && i < cb.length && ca[i] === cb[i]) i++;
    if (!i) return '';
    const u = ca.length - i, d = cb.length - i, tg = sexOf(target);

    if (u === 0) return ez(descTerm(d, tg));
    if (d === 0) return ez(ancTerm(u, tg));

    if (u === 1 && d === 1) {
      const ma = motherOf(ego), mb = motherOf(target);
      const half = ma && mb && ma !== mb;
      return (tg === 'f' ? 'خواهر' : 'برادر') + (half ? ' ناتنی' : '');
    }
    if (u === 1) {
      const sib = cb[i];
      const w = sexOf(sib) === 'f' ? 'خواهرزاده' : 'برادرزاده';
      return d === 2 ? ez(w) : ez(descTerm(d - 1, tg)) + ' ' + ez(w);
    }

    /* u >= 2: the uncle family. The side comes from the sex of the parent that
       connects the two lines, not from the viewer's own sex. */
    const s = u - 2;
    const linkParent = ca[ca.length - 1 - s - 1];
    const paternal = sexOf(linkParent) !== 'f';
    const U = cb[i];
    let base;
    if (d === 1) base = uncleTerm(paternal, tg);
    else if (d === 2) base = (tg === 'f' ? 'دختر' : 'پسر') + uncleTerm(paternal, sexOf(U));
    else base = ez(descTerm(d - 1, tg)) + ' ' + ez(uncleTerm(paternal, sexOf(U)));

    if (s === 0) return ez(base);
    return ez(base) + ' ' + ez(ancTerm(s, sexOf(ca[ca.length - 1 - s])));
  }

  /* ---- marriage, resolved before blood -------------------------------- */
  function marriagePhrase(ego, target) {
    const A = P[ego], B = P[target];
    if (!A || !B) return null;

    /* the viewer is themselves married in */
    if (A.spouseOf) {
      const h = A.spouseOf;
      if (target === h) return 'همسر';
      if (B.spouseOf === h) return 'هوو';                     // two wives of one man
      if (B.parent === h) {
        const om = motherOf(target);
        if (om && om !== A.name) return sexOf(target) === 'f' ? 'نادختری' : 'ناپسری';
      }
      /* down his line: her own descendants are hers; anyone else is «…ِ همسر» */
      const cb = chain(target), ih = cb.indexOf(h);
      if (ih >= 0 && ih < cb.length - 1) {
        const heir = cb[ih + 1], mo = motherOf(heir);
        if (mo && mo === A.name) return relate(h, target);
      }
      const core = relate(h, target);
      return core ? ez(core) + ' همسر' : null;
    }

    /* the target is married in */
    if (B.spouseOf) {
      const h = B.spouseOf;
      if (h === ego) return 'همسر';
      if (A.spouseOf === h) return 'هوو';

      const ca = chain(ego), idx = ca.indexOf(h);
      if (idx >= 0 && idx < ca.length - 1) {
        /* his wife, and the viewer descends from him: grandmother or co-wife */
        const u = ca.length - 1 - idx, heir = ca[idx + 1];
        const mo = motherOf(heir);
        if (mo && mo === B.name) return ez(ancTerm(u, 'f'));
        return 'همسر دیگرِ ' + ez(ancTerm(u, sexOf(h)));
      }
      const core = relate(ego, h);
      return 'همسر' + (core ? ' ' + ez(core) : '');
    }
    return null;
  }

  /* ---- public --------------------------------------------------------- */
  /* the phrase without the trailing "شما", e.g. پدربزرگِ */
  function relate(ego, target) {
    if (!ego || !target || !P[ego] || !P[target]) return '';
    if (ego === target) return '';
    const m = marriagePhrase(ego, target);
    const out = m != null ? m : bloodPhrase(ego, target);
    return (out || '').replace(new RegExp(KASRE + '{2,}', 'g'), KASRE);
  }

  /* the full sentence as shown to the reader */
  function relation(ego, target) {
    if (ego === target) return 'خودتان';
    const r = relate(ego, target);
    return r ? ez(r) + ' شما' : '';
  }

  /* X is the <phrase> of Y — used on the نسبت chart */
  function between(a, b) {
    const r = relate(a, b);
    return r ? nameOf(b) + '، ' + ez(r) + ' ' + nameOf(a) : '';
  }

  function commonAncestor(ids) {
    const chs = ids.map(chain);
    let i = 0;
    while (chs.every(c => i < c.length) && new Set(chs.map(c => c[i])).size === 1) i++;
    if (!i) return null;
    const set = new Set();
    chs.forEach(c => c.slice(i - 1).forEach(x => set.add(x)));
    return { lca: chs[0][i - 1], set };
  }

  function descendantCount(id, seen) {
    seen = seen || new Set();
    if (seen.has(id)) return 0;
    seen.add(id);
    let n = 0;
    for (const k of childrenOfBlood(id)) n += 1 + descendantCount(k, seen);
    return n;
  }

  return {
    nameOf, sexOf, isSpouse, chain, motherOf, childrenOf, childrenOfBlood,
    spousesOf, relate, relation, between, commonAncestor, descendantCount,
    ez, fa, ancTerm, descTerm,
  };
}

/* ============================================================================
   app.js — views and interaction.

   Four surfaces of three kinds, which is the distinction the first build blurred:
     شخص   a place        the person
     تبار   a lens        on that same person
     یافتن  a finder      browse first, search as refinement
     نسبت   a mode        entered from a person, left by finishing

   Selection (نسبت) lives in exactly one place: the نسبت screen. History and
   selection are different sets and never share a control.
   ============================================================================ */


function start(archive, assets) {
  const P = {};
  for (const r of archive.people) P[r.id] = r;
  const K = createKinship(P);
  const { nameOf, sexOf, motherOf, childrenOf, childrenOfBlood, spousesOf, chain } = K;
  const fa = K.fa;

  /* ---- state --------------------------------------------------------- */
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let me = store.get('me', null); if (!P[me]) me = null;
  /* Gift / challenge can force «من» via ?gift=1 (ASCII-safe) or ?me=ID */
  try {
    const q = new URLSearchParams(location.search);
    let id = q.get('me');
    if (q.has('gift')) {
      const g = q.get('gift');
      if (!g || g === '1' || g === 'dad') id = 'ب-2-2';
      else id = g;
    }
    if (id) {
      try { id = decodeURIComponent(id); } catch {}
      try { id = id.normalize('NFC'); } catch {}
      if (P[id]) { me = id; store.set('me', me); }
    }
  } catch {}
  let picks = (store.get('picks', []) || []).filter(id => P[id]);
  let cur = 'ROOT';
  let view = 'person';                      // person | tree | link | about
  let finderAt = 'ROOT', finderMode = 'go';

  const $ = id => document.getElementById(id);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  const rel = id => (me && me !== id) ? K.relation(me, id) : (me === id ? 'خودتان' : '');

  /* ---- marks --------------------------------------------------------- */
  const SHIELD = assets.shieldPath, SHIELD_VB = '0 0 100 125.49';
  const M = assets.marks;
  function markSVG(sex, size) {
    const small = size < 40;
    const unknown = sex !== 'm' && sex !== 'f';
    const d = sex === 'm' ? (small ? M.cypressSmall : M.cypress)
      : sex === 'f' ? (small ? M.botehSmall : M.boteh)
      : (small ? M.unknownSmall : M.unknown);
    /* unknown ring fills the viewBox; scale it in so it doesn’t kiss the shield */
    const body = unknown
      ? `<g transform="translate(50 50) scale(0.72) translate(-50 -50)"><path d="${d}" fill="var(--oxblood)" opacity="${small ? '.7' : '.8'}"/></g>`
      : `<path d="${d}" fill="var(--oxblood)" opacity="${small ? '.7' : '.8'}"/>`;
    return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${body}</svg>`;
  }
  /* Small glyphs are drawn separately: the shield path is a contour, so filling
     it at 13px yields a ring rather than a mass. */
  const GLYPH = {
    person: '<svg viewBox="0 0 44 56"><path d="M22 2c6.4 0 10.4 4.6 10.6 9.6h4.2v3.2H38V36c0 10.2-7.2 18-16 18S6 46.2 6 36V14.8h1.2V11.6h4.2C11.6 6.6 15.6 2 22 2z" fill="currentColor"/></svg>',
    tree: '<svg viewBox="0 0 44 56"><g fill="none" stroke="currentColor" stroke-width="3.6">'
      + '<path d="M22 9v9M22 27v11"/><path d="M11 45v-7h22v7"/></g>'
      + '<circle cx="22" cy="6" r="4" fill="currentColor"/><circle cx="22" cy="23" r="4.6" fill="currentColor"/>'
      + '<circle cx="11" cy="49" r="4" fill="currentColor"/><circle cx="33" cy="49" r="4" fill="currentColor"/></svg>',
  };
  const photoSrc = id => {
    if (assets.photos && assets.photos[id]) return assets.photos[id];
    if (assets.photoBase && id && P[id] && P[id].photo)
      return assets.photoBase + encodeURIComponent(id) + '.jpg';
    return null;
  };

  const DOC_KIND = { wedding: 'عقدنامه', birth: 'شناسنامه', death: 'فوت', other: 'سند' };
  function docSrc(file) {
    if (!file) return null;
    if (assets.docs && assets.docs[file]) return assets.docs[file];
    if (assets.docsBase) return assets.docsBase + encodeURIComponent(file);
    return null;
  }
  function docsFor(id) {
    const out = [];
    const seen = new Set();
    for (const r of archive.people) {
      const list = r.docs;
      if (!list || !list.length) continue;
      for (const d of list) {
        const people = (d.with && d.with.length) ? d.with : [r.id];
        if (!people.includes(id)) continue;
        const key = d.id || d.file;
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(d);
      }
    }
    return out;
  }
  function openDocViewer(src, title) {
    let v = $('docview');
    if (!v) {
      v = el('div', 'docview'); v.id = 'docview';
      const close = el('button', 'dv-close', '×');
      close.type = 'button'; close.setAttribute('aria-label', 'بستن');
      close.onclick = () => { v.classList.remove('on'); };
      const img = document.createElement('img'); img.id = 'docviewImg'; img.alt = '';
      img.draggable = false;
      img.addEventListener('contextmenu', e => e.preventDefault());
      v.appendChild(close); v.appendChild(img);
      v.addEventListener('click', e => { if (e.target === v) v.classList.remove('on'); });
      document.body.appendChild(v);
    }
    const img = $('docviewImg');
    img.src = src; img.alt = title || '';
    v.classList.add('on');
  }
  function renderDocs(app, id) {
    const list = docsFor(id);
    if (!list.length) return;
    const wrap = el('div', 'docs');
    wrap.appendChild(el('div', 'dhead', 'اسناد'));
    const ul = el('div', 'dlist');
    list.forEach(d => {
      const src = docSrc(d.file);
      if (!src) return;
      const row = el('button', 'drow');
      row.type = 'button';
      row.appendChild(el('span', 'dkind', DOC_KIND[d.kind] || DOC_KIND.other));
      row.appendChild(el('span', 'dtitle', d.title || 'سند'));
      if (d.year != null) row.appendChild(el('span', 'dyear', fa(d.year)));
      row.onclick = () => openDocViewer(src, d.title);
      ul.appendChild(row);
    });
    if (!ul.children.length) return;
    wrap.appendChild(ul);
    app.appendChild(wrap);
  }

  function shieldNode(id, cls, label, sub, opts) {
    opts = opts || {};
    const ghost = opts.ghost != null ? opts.ghost : (id && P[id] && P[id].origin === 'name-only');
    const n = el('div', 'node ' + cls + (ghost ? ' ghost' : '') + (opts.wed ? ' wed' : '') + (opts.chosen ? ' chosen' : ''));
    const sh = el('div', 'sh');
    sh.innerHTML = `<svg viewBox="${SHIELD_VB}" preserveAspectRatio="none"><path d="${SHIELD}"`
      + ` fill="none" stroke="var(--oxblood)" stroke-width="1.6"`
      + (ghost ? ' stroke-dasharray="4 4" opacity=".55"' : '') + (opts.wed ? ' opacity=".62"' : '') + '/></svg>';
    const im = el('div', 'im');
    const src = id && photoSrc(id);
    if (src) {
      const g = document.createElement('img');
      g.src = src; g.alt = ''; g.draggable = false;
      g.addEventListener('contextmenu', e => e.preventDefault());
      im.appendChild(g);
    }
    else im.innerHTML = markSVG(id ? sexOf(id) : opts.sex, cls.includes('focus') ? 42 : 26);
    sh.appendChild(im); n.appendChild(sh);
    n.appendChild(el('div', 'nn', label));
    if (sub) n.appendChild(el('div', 'nr', sub));
    if (id && !opts.inert) {
      n.tabIndex = 0; n.setAttribute('role', 'button');
      n.onclick = () => go(id, undefined, n);
      n.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(id, undefined, n); }
      };
    }
    return n;
  }

  /* ---- navigation ----------------------------------------------------- */
  const scrollPos = Object.create(null);
  try { history.scrollRestoration = 'manual'; } catch {}

  function saveScroll() {
    scrollPos[cur + ':' + view] = window.scrollY || window.pageYOffset || 0;
  }
  function pinTreeShield(midY) {
    const sh = document.querySelector('.node.focus .sh');
    if (!sh || midY == null) return;
    const r = sh.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    const dy = mid - midY;
    if (Math.abs(dy) > 0.5) {
      const y = (window.pageYOffset || window.scrollY || 0) + dy;
      window.scrollTo(0, y);
    }
  }
  function restoreScroll() {
    if (view === 'tree') {
      window.scrollTo(0, scrollPos[cur + ':' + view] || 0);
      return;
    }
    window.scrollTo(0, scrollPos[cur + ':' + view] || 0);
  }
  function go(id, keepLens, fromNode) {
    if (!P[id]) return;
    /* keep the tapped shield’s midpoint under the finger (no page jump) */
    let pinMid = null;
    if (view === 'tree' && fromNode) {
      const sh = fromNode.querySelector('.sh') || fromNode;
      const r = sh.getBoundingClientRect();
      pinMid = r.top + r.height / 2;
    }
    saveScroll();
    cur = id;
    /* the lens persists while walking a line, so climbing does not cost two
       taps a generation; it resets when you arrive from elsewhere */
    if (!keepLens && view !== 'tree') view = 'person';
    syncHash();

    const app = $('app');
    /* iOS clamps scroll when #app collapses — hold height through the rebuild */
    const hold = view === 'tree' && pinMid != null;
    if (hold) app.style.minHeight = app.offsetHeight + 'px';

    render();

    if (hold) {
      pinTreeShield(pinMid);
      app.style.minHeight = '';
      /* one more pass after minHeight release / layout settle */
      pinTreeShield(pinMid);
    } else {
      restoreScroll();
    }
  }
  function syncHash() {
    /* pushState (not location.hash=) — assigning hash scrolls iOS Safari to top */
    const next = encodeURIComponent(cur) + (view !== 'person' ? '/' + view : '');
    try {
      const curHash = (location.hash || '').replace(/^#/, '');
      if (curHash === next) return;
      history.pushState(null, '', '#' + next);
    } catch {}
  }
  const idAliases = (archive.meta && archive.meta.idAliases) || {};
  function readHash() {
    try {
      const h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (!h) return false;
      const [raw, v] = h.split('/');
      const id = P[raw] ? raw : idAliases[raw];
      if (!P[id]) return false;
      cur = id;
      view = ['tree', 'link', 'about'].includes(v) ? v : 'person';
      return true;
    } catch { return false; }
  }

  /* ---- picks (نسبت) ---------------------------------------------------- */
  const hasPick = id => picks.includes(id);
  function togglePick(id) {
    const i = picks.indexOf(id);
    if (i >= 0) picks.splice(i, 1);
    else { if (picks.length >= 4) return false; picks.push(id); }
    store.set('picks', picks); return true;
  }

  /* ---- shared bits ------------------------------------------------------ */
  function lens() {
    const w = el('div', 'lens');
    const mk = (label, key, active, v) => {
      const b = el('button');
      b.innerHTML = `<span class="lg">${GLYPH[key]}</span><span>${label}</span>`;
      b.setAttribute('aria-current', active ? 'true' : 'false');
      b.onclick = () => {
        if (active) return;
        saveScroll();
        view = v; syncHash(); render(); restoreScroll();
      };
      return b;
    };
    w.appendChild(mk('شخص', 'person', view !== 'tree', 'person'));
    w.appendChild(mk('تبار', 'tree', view === 'tree', 'tree'));
    return w;
  }

  function setMeButton(cls) {
    const b = el('button', cls || '', cur === me ? 'این من نیستم' : 'این منم');
    b.onclick = () => {
      if (cur === me) { me = null; store.del('me'); }
      else { me = cur; store.set('me', me); }
      render();
    };
    return b;
  }

  function footLinks() {
    const f = el('div', 'foot');
    const add = el('button', '', hasPick(cur) ? 'برداشتن از نسبت' : 'افزودن به نسبت');
    add.onclick = () => {
      if (!togglePick(cur)) { alert('چهار نفر کامل است. اول یکی را بردارید.'); return; }
      render();
    };
    f.appendChild(add);
    /* the only evidence of a selection outside the نسبت screen: a count, which
       is still true in a minute, rather than a message that is true for two
       seconds */
    if (picks.length) {
      if (picks.length < 2) f.appendChild(el('div', 'count', fa(picks.length) + ' نفر در نسبت'));
      else {
        const b = el('button', 'accent', 'دیدن نسبت — ' + fa(picks.length) + ' نفر');
        b.onclick = () => { saveScroll(); view = 'link'; syncHash(); render(); window.scrollTo(0, 0); };
        f.appendChild(b);
      }
    }
    f.appendChild(setMeButton());

    const pdf = el('button', '', 'ذخیره به صورت PDF');
    pdf.onclick = () => printPage(nameOf(cur), view !== 'person');
    f.appendChild(pdf);

    const wrong = el('button', '', 'این درست نیست');
    wrong.onclick = () => reportError(cur);
    f.appendChild(wrong);

    const ab = el('button', '', 'قواعد این آرشیو');
    ab.onclick = () => { saveScroll(); view = 'about'; syncHash(); render(); window.scrollTo(0, 0); };
    f.appendChild(ab);
    return f;
  }

  function crumb() {
    const c = el('div', 'crumb');
    chain(cur).forEach((k, i) => {
      if (i) c.appendChild(el('span', 'sep', '›'));
      if (k === cur) c.appendChild(el('span', 'here', nameOf(k)));
      else { const b = el('button', '', nameOf(k)); b.onclick = () => go(k); c.appendChild(b); }
    });
    return c;
  }

  function group(title, items, open) {
    const g = el('div', 'group'); g.dataset.open = open ? 'true' : 'false';
    const h = el('button', 'ghead');
    h.appendChild(el('span', '', title));
    const r = document.createElement('span');
    r.appendChild(el('span', 'gcount', fa(items.length)));
    r.appendChild(el('span', 'chev'));
    h.appendChild(r);
    h.onclick = () => g.dataset.open = g.dataset.open === 'true' ? 'false' : 'true';
    const body = el('div', 'gbody');
    if (!items.length) {
      const e = el('div', 'row'); const p = el('div', 'rn');
      p.appendChild(el('div', 'rsub', 'رکوردی ثبت نشده')); e.appendChild(p); body.appendChild(e);
    }
    items.forEach(it => {
      const row = el('div', 'row' + (it.id ? ' link' : ''));
      const p = el('div', 'rn');
      p.appendChild(el('div', 'rname', it.name));
      if (it.sub) p.appendChild(el('div', 'rsub', it.sub));
      row.appendChild(p);
      if (it.id) {
        row.appendChild(el('div', 'arrow'));
        row.tabIndex = 0; row.setAttribute('role', 'button');
        row.onclick = () => go(it.id);
        row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(it.id); } };
      }
      body.appendChild(row);
    });
    g.appendChild(h); g.appendChild(body);
    return g;
  }

  /* ---- شخص --------------------------------------------------------------- */
  function renderPerson(app) {
    const n = P[cur], root = cur === 'ROOT';
    const head = el('div', 'head');
    head.appendChild(el('div', 'gen', 'نسل ' + fa(generationOf(cur))));
    head.appendChild(el('div', 'name', nameOf(cur)));
    const r = rel(cur);
    head.appendChild(el('div', 'rel', me ? r : 'برای دیدن نسبت‌ها نام خودتان را انتخاب کنید'));
    app.appendChild(head);
    app.appendChild(lens());

    if (root) {
      const w = el('div', 'emblem-big');
      const i = document.createElement('img'); i.src = assets.emblem; i.alt = 'نشان خانواده رهگشای';
      w.appendChild(i); w.appendChild(el('span', '', 'بادرود'));
      app.appendChild(w);
    } else {
      const w = el('div', 'portrait'), s = el('div', 'shield');
      s.innerHTML = `<svg class="frame" viewBox="${SHIELD_VB}" preserveAspectRatio="none">`
        + `<path d="${SHIELD}" fill="none" stroke="var(--oxblood)" stroke-width="1.5"`
        + (n.origin === 'name-only' ? ' stroke-dasharray="4 4" opacity=".6"' : '') + '/></svg>';
      const f = el('div', 'fill');
      const src = photoSrc(cur);
      if (src) {
        const g = document.createElement('img');
        g.src = src; g.alt = nameOf(cur); g.draggable = false;
        g.addEventListener('contextmenu', e => e.preventDefault());
        f.appendChild(g);
      }
      else {
        f.appendChild(el('div', 'initial', (nameOf(cur) || '؟').trim()[0]));
        const m = el('div'); m.innerHTML = markSVG(sexOf(cur), 34); f.appendChild(m);
      }
      s.appendChild(f); w.appendChild(s); app.appendChild(w);
    }

    const facts = [];
    if (n.family) facts.push(['نام خانوادگی', n.family]);
    if (n.birth || n.death) facts.push(['سال', (n.birth ? fa(n.birth) : '؟') + (n.death ? ' — ' + fa(n.death) : '')]);
    if (n.place) facts.push(['زادگاه', n.place]);
    if (n.job) facts.push(['شغل', n.job]);
    if (n.spouseOf) facts.push(['همسرِ', nameOf(n.spouseOf)]);
    const dc = n.spouseOf ? 0 : K.descendantCount(cur);
    if (dc > 2) facts.push(['نوادگان', fa(dc) + ' نفر']);
    if (facts.length) {
      const f = el('dl', 'facts');
      facts.forEach(([a, b]) => {
        const row = el('div', 'fact');
        row.appendChild(el('dt', '', a)); row.appendChild(el('dd', '', b));
        f.appendChild(row);
      });
      app.appendChild(f);
    }

    if (n.origin === 'name-only') {
      const nt = el('div', 'notes');
      nt.appendChild(el('p', '', 'در سند فقط نام ایشان آمده است. اگر چیزی می‌دانید، اضافه کنید.'));
      app.appendChild(nt);
    } else if (n.note) {
      const nt = el('div', 'notes'); nt.appendChild(el('p', '', n.note)); app.appendChild(nt);
    }

    renderDocs(app, cur);

    app.appendChild(el('div', 'girih'));

    const gs = el('div', 'groups');
    /* parents: both, because the mother is a person here and not a caption */
    if (n.parent && P[n.parent]) {
      const par = [{ id: n.parent, name: nameOf(n.parent), sub: rel(n.parent) }];
      const mo = motherOf(cur);
      const wi = mo ? spousesOf(n.parent).find(w => P[w].name === mo) : null;
      if (wi) par.push({ id: wi, name: mo, sub: rel(wi) });
      else if (mo) par.push({ id: null, name: mo, sub: 'مادر' });
      gs.appendChild(group(par.length > 1 ? 'پدر و مادر' : 'پدر', par, true));
    }
    const sp = spousesOf(cur).map(id => ({ id, name: nameOf(id), sub: rel(id) }));
    if (n.spouseOf) sp.push({ id: n.spouseOf, name: nameOf(n.spouseOf), sub: rel(n.spouseOf) });
    if (sp.length) gs.appendChild(group(sp.length > 1 ? 'همسران' : 'همسر', sp, true));

    const kids = childrenOf(cur);
    gs.appendChild(group('فرزندان', kids.map(k => ({
      id: k, name: nameOf(k),
      sub: P[k].origin === 'name-only' ? 'بدون رکورد' : rel(k),
    })), true));

    /* siblings split by mother, and only when both mothers are known */
    const anchor = n.spouseOf ? null : n.parent;
    if (anchor && P[anchor]) {
      const mine = motherOf(cur);
      const full = [], half = [];
      childrenOfBlood(anchor).filter(k => k !== cur).forEach(k => {
        const om = motherOf(k);
        ((mine && om && om !== mine) ? half : full).push(k);
      });
      const mk = k => ({ id: k, name: nameOf(k), sub: rel(k) });
      if (full.length) gs.appendChild(group(half.length ? 'خواهر و برادر تنی' : 'خواهر و برادر', full.map(mk), false));
      if (half.length) gs.appendChild(group('خواهر و برادر ناتنی', half.map(mk), false));
    }
    app.appendChild(gs);

    if (n.informants) {
      const s = el('div', 'notes');
      s.appendChild(el('p', '', 'این شاخه از شجره‌نامه را ' + n.informants.join(' و ') + ' ثبت کرده‌اند.'));
      app.appendChild(s);
    }
    app.appendChild(crumb());
    app.appendChild(footLinks());
  }

  const generationOf = id => Math.max(0, chain(id).length - 1);

  /* ---- تبار ---------------------------------------------------------------- */
  function renderTree(app) {
    const n = P[cur];
    const head = el('div', 'head');
    head.appendChild(el('div', 'gen', 'نسل ' + fa(generationOf(cur))));
    head.appendChild(el('div', 'name', nameOf(cur)));
    app.appendChild(head);
    app.appendChild(lens());

    const wrap = el('div', 'tree');

    if (n.spouseOf) {
      /* she has no bloodline of her own here: show the marriage and say where
         the line actually continues — and still let her set شما here */
      wrap.appendChild(el('div', 'tlabel', 'همسرِ'));
      const r = el('div', 'tier');
      r.appendChild(shieldNode(n.spouseOf, 'up', nameOf(n.spouseOf), rel(n.spouseOf)));
      wrap.appendChild(r);
      wrap.appendChild(el('div', 'stem'));
      wrap.appendChild(el('div', 'lead', 'تبارِ خونی از سمت ' + nameOf(n.spouseOf) + ' دنبال می‌شود'));
    } else {
      const line = chain(cur), ups = line.slice(0, -1);
      if (ups.length) {
        wrap.appendChild(el('div', 'tlabel', 'نیاکان'));
        ups.forEach((k, i) => {
          const t = el('div', 'tier');
          const nd = shieldNode(k, 'up', nameOf(k), rel(k));
          /* climbing, the only relevant wife is the one this line descends
             through; his other wives belong on his own page */
          const heir = line[i + 1];
          const mo = heir ? motherOf(heir) : null;
          const wid = mo ? spousesOf(k).find(w => P[w].name === mo) : null;
          if (mo) {
            t.classList.add('couple');
            t.appendChild(el('div', 'spacer'));
            t.appendChild(nd);
            const side = el('div', 'side');
            side.appendChild(el('div', 'bar'));
            side.appendChild(shieldNode(wid || null, 'up', mo, 'مادرِ ' + nameOf(heir),
              { wed: true, sex: 'f', inert: !wid }));
            t.appendChild(side);
          } else t.appendChild(nd);
          wrap.appendChild(t);
          wrap.appendChild(el('div', 'stem'));
        });
      }
    }

    /* the focus row: person on the page centre line whatever sits beside them */
    const f = el('div', 'tier couple');
    const sibs = el('div', 'sibs');
    if (n.parent && P[n.parent]) {
      childrenOfBlood(n.parent).filter(k => k !== cur)
        .forEach(k => sibs.appendChild(shieldNode(k, 'sib', nameOf(k), rel(k))));
    }
    f.appendChild(sibs);
    f.appendChild(shieldNode(cur, 'focus', nameOf(cur), me ? rel(cur) : '', { chosen: hasPick(cur) }));
    const side = el('div', 'side');
    spousesOf(cur).forEach((w, i) => {
      side.appendChild(el('div', 'bar'));
      side.appendChild(shieldNode(w, 'down', nameOf(w),
        spousesOf(cur).length > 1 ? 'همسر ' + fa(i + 1) : 'همسر', { wed: true }));
    });
    f.appendChild(side);
    wrap.appendChild(f);

    const kids = childrenOf(cur);
    if (kids.length) {
      wrap.appendChild(el('div', 'stem'));
      const mothers = [...new Set(kids.map(motherOf).filter(Boolean))];
      const showMo = !n.spouseOf && (mothers.length > 1 || (spousesOf(cur).length > 1 && mothers.length > 0));
      wrap.appendChild(el('div', 'tlabel', 'فرزندان (' + fa(kids.length) + ')'));
      if (showMo) {
        mothers.forEach(mo => {
          wrap.appendChild(el('div', 'molabel', 'از ' + mo));
          const t = el('div', 'tier kids');
          kids.filter(k => motherOf(k) === mo)
            .forEach(k => t.appendChild(shieldNode(k, 'down', nameOf(k), rel(k))));
          wrap.appendChild(t);
        });
        const rest = kids.filter(k => !motherOf(k));
        if (rest.length) {
          wrap.appendChild(el('div', 'molabel', 'مادر نامشخص'));
          const t = el('div', 'tier kids');
          rest.forEach(k => t.appendChild(shieldNode(k, 'down', nameOf(k), rel(k))));
          wrap.appendChild(t);
        }
      } else {
        const t = el('div', 'tier kids');
        kids.forEach(k => t.appendChild(shieldNode(k, 'down', nameOf(k),
          P[k].origin === 'name-only' ? 'بدون رکورد' : rel(k))));
        wrap.appendChild(t);
      }
    } else wrap.appendChild(el('div', 'tlabel', 'فرزندی ثبت نشده'));

    app.appendChild(wrap);
    app.appendChild(crumb());
    app.appendChild(footLinks());
    scaleNodes();
  }

  /* nodes grow toward the centre of the screen as you scroll: the same feeling
     as dock magnification, driven by position so it works without a pointer */
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf = null;
  function scaleNodes() {
    if (reduced || view !== 'tree') return;
    const mid = window.innerHeight / 2, span = window.innerHeight * 0.55;
    document.querySelectorAll('.node').forEach(n => {
      /* focus stays put — dock scale on the active person causes a finger-jump */
      if (n.classList.contains('focus')) {
        n.style.transform = '';
        n.style.opacity = '';
        return;
      }
      const r = n.getBoundingClientRect();
      const d = Math.min(1, Math.abs(r.top + r.height / 2 - mid) / span);
      n.style.transform = 'scale(' + (1.08 - 0.22 * d).toFixed(3) + ')';
      n.style.opacity = (1 - 0.4 * d).toFixed(3);
    });
  }
  window.addEventListener('scroll', () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = null; scaleNodes(); });
  }, { passive: true });
  window.addEventListener('resize', scaleNodes);

  /* ---- نسبت ---------------------------------------------------------------- */
  function renderLink(app) {
    const head = el('div', 'head');
    head.appendChild(el('div', 'name', 'نسبت'));
    app.appendChild(head);

    if (picks.length < 2) {
      app.appendChild(el('div', 'lead', picks.length
        ? 'یک نفر دیگر را اضافه کنید تا نسبت را ببینید.'
        : 'دو نفر را انتخاب کنید تا ببینید چطور با هم نسبت دارند.'));
    }
    app.appendChild(pickList());
    if (picks.length < 2) { app.appendChild(footLinksLite()); return; }

    for (let i = 0; i < picks.length; i++) {
      for (let j = i + 1; j < picks.length; j++) {
        const a = picks[i], b = picks[j];
        const line = K.between(a, b);
        if (!line) continue;
        const p = el('div', 'verdict', line);
        const wed = (P[a].spouseOf === b) || (P[b].spouseOf === a);
        if (wed) p.appendChild(el('span', 'also',
          'و با هم ازدواج کرده‌اند؛ پس هم از راه خون و هم از راه ازدواج نسبت دارند.'));
        app.appendChild(p);
      }
    }

    const u = K.commonAncestor(picks);
    if (!u) { app.appendChild(el('div', 'lead', 'پیوندی پیدا نشد.')); app.appendChild(footLinksLite()); return; }
    app.appendChild(el('div', 'lead', 'جد مشترک'));
    app.appendChild(linkBranch(u.lca, u.set));
    app.appendChild(footLinksLite());
  }

  function pickList() {
    const box = el('div', 'picks');
    picks.forEach((id, i) => {
      const r = el('div', 'pick');
      r.appendChild(el('span', 'no', fa(i + 1)));
      const b = el('button', 'pn', nameOf(id)); b.onclick = () => go(id);
      r.appendChild(b);
      const x = el('button', 'rm', '×');
      x.setAttribute('aria-label', 'برداشتن');
      x.onclick = () => { togglePick(id); render(); };
      r.appendChild(x);
      box.appendChild(r);
    });
    const add = el('button', 'addp', picks.length >= 4 ? 'چهار نفر کامل است' : 'افزودن شخص');
    if (picks.length >= 4) add.disabled = true; else add.onclick = () => openFinder('add');
    box.appendChild(add);
    return box;
  }

  function linkKids(id, set) {
    return childrenOfBlood(id).filter(k => set.has(k))
      .concat(spousesOf(id).filter(w => set.has(w)));
  }
  function linkBranch(id, set) {
    const wrap = el('div', 'branch');
    const pick = picks.indexOf(id);
    const all = linkKids(id, set);
    const kids = all.filter(k => !P[k].spouseOf);
    const wives = all.filter(k => P[k].spouseOf === id);
    const cls = pick >= 0 ? 'down' : (kids.length > 1 ? 'down' : 'up');
    const node = shieldNode(id, cls, nameOf(id), '', { chosen: pick >= 0 });
    if (pick >= 0) node.insertBefore(el('div', 'tag', fa(pick + 1)), node.firstChild);

    if (wives.length) {
      const row = el('div', 'tier couple');
      row.appendChild(el('div', 'spacer'));
      row.appendChild(node);
      const side = el('div', 'side');
      wives.forEach(w => {
        side.appendChild(el('div', 'bar'));
        const wp = picks.indexOf(w);
        const wn = shieldNode(w, cls, nameOf(w), '', { wed: true, chosen: wp >= 0 });
        if (wp >= 0) wn.insertBefore(el('div', 'tag', fa(wp + 1)), wn.firstChild);
        side.appendChild(wn);
      });
      row.appendChild(side);
      wrap.appendChild(row);
    } else wrap.appendChild(node);

    if (kids.length) {
      wrap.appendChild(el('div', 'stem'));
      const row = el('div', 'brow');
      kids.forEach(k => {
        const b = linkBranch(k, set);
        b.insertBefore(el('div', 'vstem'), b.firstChild);
        row.appendChild(b);
      });
      wrap.appendChild(row);
    }
    return wrap;
  }

  function footLinksLite() {
    const f = el('div', 'foot');
    const back = el('button', 'accent', 'بازگشت به ' + nameOf(cur));
    back.onclick = () => { view = 'person'; syncHash(); render(); };
    f.appendChild(back);
    if (picks.length >= 2) {
      const pdf = el('button', '', 'ذخیره به صورت PDF');
      pdf.onclick = () => printPage('نسبت خانوادگی', true);
      f.appendChild(pdf);
    }
    return f;
  }

  /* ---- یافتن: browse first, search as refinement ---------------------------- */
  function openFinder(mode) {
    finderMode = mode || 'go';
    finderAt = (P[cur] && cur !== 'ROOT' && !P[cur].spouseOf && childrenOfBlood(cur).length) ? cur : 'ROOT';
    $('fq').value = '';
    $('finder').classList.add('on');
    drawFinder();
    try { $('finder').scrollTo({ top: 0 }); } catch { $('finder').scrollTop = 0; }
  }
  const closeFinder = () => $('finder').classList.remove('on');

  function drawFinder() {
    const body = $('fbody'), trail = $('ftrail');
    const q = ($('fq').value || '').trim();
    body.innerHTML = ''; trail.innerHTML = '';

    if (q) {                                   /* search: a refinement, not the door */
      const norm = s => (s || '').replace(/[\u064A\u0649]/g, 'ی').replace(/\u0643/g, 'ک')
        .replace(/[\u064B-\u0652\u200c]/g, '').replace(/[\u0622\u0623\u0625]/g, 'ا').trim();
      const t = norm(q);
      const a = [], b = [], a2 = [], b2 = [];
      for (const id in P) {
        const i = norm(nameOf(id)).indexOf(t);
        if (i < 0) continue;
        const stub = P[id].origin === 'name-only';
        (i === 0 ? (stub ? a2 : a) : (stub ? b2 : b)).push(id);
      }
      const res = a.concat(b, a2, b2);
      body.appendChild(el('div', 'empty', res.length ? fa(res.length) + ' نتیجه' : 'کسی با این نام پیدا نشد.'));
      res.slice(0, 200).forEach(id => body.appendChild(resultRow(id)));
      return;
    }

    chain(finderAt).forEach((k, i) => {         /* where you are, and every level back */
      if (i) trail.appendChild(el('span', 'sep', '›'));
      if (k === finderAt) trail.appendChild(el('span', 'here', nameOf(k)));
      else { const b = el('button', '', nameOf(k)); b.onclick = () => { finderAt = k; drawFinder(); }; trail.appendChild(b); }
    });

    if (finderAt !== 'ROOT') {
      const enter = el('button', 'enter', 'دیدن صفحهٔ ' + nameOf(finderAt));
      enter.onclick = () => choose(finderAt);
      body.appendChild(enter);
    }
    const kids = childrenOfBlood(finderAt);
    const grid = el('div', 'grid');
    kids.forEach(k => grid.appendChild(cell(k)));
    const gap = (3 - kids.length % 3) % 3;
    if (gap) { const f = el('div', 'fill'); f.style.gridColumn = 'span ' + gap; grid.appendChild(f); }
    body.appendChild(kids.length ? grid : el('div', 'empty', 'فرزندی ثبت نشده.'));
  }

  function cell(id) {
    const n = childrenOfBlood(id).length;
    const pick = picks.indexOf(id);
    const c = el('button', 'cell' + (pick >= 0 ? ' picked' : ''));
    const g = el('div', 'cg'); g.innerHTML = markSVG(sexOf(id), 22); c.appendChild(g);
    c.appendChild(el('div', 'cn', nameOf(id)));
    c.appendChild(el('div', 'cs', P[id].origin === 'name-only' ? 'بدون رکورد'
      : n ? fa(n) + ' فرزند' : '—'));
    if (pick >= 0) c.appendChild(el('div', 'cnum', fa(pick + 1)));
    c.onclick = () => n ? (finderAt = id, drawFinder()) : choose(id);
    return c;
  }

  function resultRow(id) {
    const path = chain(id).slice(1, -1).map(nameOf).join(' › ');
    const r = el('button', 'res' + (picks.includes(id) ? ' on' : ''));
    r.appendChild(el('div', 'rn2', nameOf(id)));
    r.appendChild(el('div', 'rp', path || '—'));
    r.onclick = () => choose(id);
    return r;
  }

  function choose(id) {
    if (finderMode === 'add') {
      if (!togglePick(id)) { alert('چهار نفر کامل است. اول یکی را بردارید.'); return; }
      closeFinder(); view = 'link'; syncHash(); render();
      return;
    }
    closeFinder(); go(id);
  }

  /* ---- قواعد ---------------------------------------------------------------- */
  function renderAbout(app) {
    const w = el('div', 'about');
    const m = document.createElement('img');
    m.className = 'mark'; m.src = assets.legend; m.alt = 'سرو، بته، نامشخص';
    w.appendChild(m);
    w.appendChild(el('h2', '', 'قواعد این آرشیو'));

    const sec = (title, paras) => {
      const s = el('section');
      s.appendChild(el('h3', '', title));
      paras.forEach(p => s.appendChild(el('p', '', p)));
      w.appendChild(el('div', 'girih'));
      w.appendChild(s);
      return s;
    };
    const marksSec = sec('سه نشان', [
      'این قرارِ ماست، نه رسمی کهن؛ آن را از میان نقش‌های ایرانی برگزیدیم چون در کنار نشان خانواده می‌نشیند.',
    ]);
    const key = el('div', 'marks-key');
    [
      ['m', 'سرو', 'مرد'],
      ['f', 'بته', 'زن'],

    ].forEach(([sex, name, meaning]) => {
      const item = el('div', 'marks-item');

      icon.innerHTML = markSVG(sex, 36);
      item.appendChild(icon);
      item.appendChild(el('div', 'marks-name', name));
      item.appendChild(el('div', 'marks-mean', meaning));
      key.appendChild(item);
    });
    marksSec.insertBefore(key, marksSec.querySelector('p'));

    sec('شمارش نیاکان', [
      'پدربزرگ را جد اول گرفته‌ایم؛ پس جد دوم، پدرِ پدربزرگ است و همین‌طور بالاتر.',
      'این شمارش همه‌جا یکسان نیست و برخی خاندان‌ها یک نسل دیرتر آغاز می‌کنند. آنچه در این آرشیو می‌بینید بر همین قرار است.',
    ]);
    let documented = 0, nameOnly = 0, spouses = 0, family = 0;
    archive.people.forEach(p => {
      if (p.id === 'ROOT') return;
      if (p.origin === 'document') documented++;
      else if (p.origin === 'name-only') nameOnly++;
      else if (p.origin === 'family') family++;
      if (p.spouseOf) spouses++;
    });
    const counts = {
      total: archive.people.filter(p => p.id !== 'ROOT').length,
      documented, nameOnly, spouses, family,
    };
    sec('بدون رکورد', [
      'در این آرشیو ' + fa(counts.total) + ' نفر هستند. '
      + fa(counts.documented) + ' نفر شرح کامل دارند: همسر، فرزندان و یادداشت‌ها.',
      fa(counts.nameOnly) + ' نفر تنها نامی هستند در سطرِ پدرشان و نه بیشتر. اینان با قابِ خط‌چین می‌آیند.',
      'این کمبود، خطا نیست. لبهٔ آن چیزی است که نوشته شده است.',
    ]);
    sec('از کجا آمده', [
      'این شجره‌نامه از سندی دست‌نویس بازسازی شده است. هر شاخه را یکی از بستگان گرد آورده و نامش در پای همان شاخه آمده است.',
    ]);
    const back = el('div', 'foot');
    const b = el('button', 'accent', 'بازگشت به ' + nameOf(cur));
    b.onclick = () => { view = 'person'; syncHash(); render(); };
    back.appendChild(b);
    w.appendChild(back);
    app.appendChild(w);
  }

  /* ---- print ----------------------------------------------------------------- */
  let printWide = false;
  function printPage(title, wide) {
    printWide = !!wide;
    $('phead').innerHTML = `<img src="${assets.emblem}" alt=""><div class="t">${title}</div>`;
    $('pfoot').style.display = '';
    const old = $('pagestyle'); if (old) old.remove();
    if (wide) {
      const s = document.createElement('style'); s.id = 'pagestyle';
      s.textContent = '@media print{@page{size:A4 landscape;margin:12mm}}';
      document.head.appendChild(s);
    }
    setTimeout(() => window.print(), 60);
  }
  /* scale to one sheet on the way in, undo on the way out, so the screen is
     never left holding a shrunken layout */
  function fitToPage() {
    const box = $('app'); if (!box) return;
    box.style.zoom = '';
    const mm = n => n / 25.4 * 96;
    const availW = printWide ? mm(297 - 24) : mm(210 - 28);
    let availH = printWide ? mm(210 - 24) : mm(297 - 32);
    availH -= ($('phead').offsetHeight || 0) + ($('pfoot').offsetHeight || 0) + mm(12);
    let z = 1;
    for (let pass = 0; pass < 2; pass++) {
      const w = box.scrollWidth, h = box.scrollHeight;
      if (!w || !h) break;
      z = Math.max(0.4, Math.min(1, Math.min(availW / w, availH / h) * z));
      box.style.zoom = z < 1 ? z.toFixed(3) : '';
      if (z >= 1) break;
    }
  }
  function resetPrint() {
    const s = $('pagestyle'); if (s) s.remove();
    const box = $('app'); if (box) box.style.zoom = '';
    $('pfoot').style.display = 'none';
  }
  window.addEventListener('beforeprint', fitToPage);
  window.addEventListener('afterprint', resetPrint);
  if (window.matchMedia) {
    const mq = window.matchMedia('print');
    const h = e => e.matches ? fitToPage() : resetPrint();
    if (mq.addEventListener) mq.addEventListener('change', h);
    else if (mq.addListener) mq.addListener(h);
  }

  /* ---- corrections ------------------------------------------------------------ */
  function reportError(id) {
    const p = P[id];
    const txt = 'اصلاح در شجره‌نامه\n\nنام: ' + nameOf(id) + '\nکد: ' + id
      + (p.parent && P[p.parent] ? '\nفرزندِ: ' + nameOf(p.parent) : '')
      + '\n\nآنچه درست نیست:\n';
    if (navigator.share) navigator.share({ title: 'اصلاح شجره‌نامه', text: txt }).catch(() => {});
    else if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(() => alert('متن اصلاح کپی شد. آن را برای سیروس یا ندا بفرستید.'));
    else prompt('این متن را کپی کنید و بفرستید:', txt);
  }

  /* ---- shell -------------------------------------------------------------------- */
  function render() {
    $('whoName').textContent = me ? nameOf(me) : 'انتخاب نشده';
    const app = $('app'); app.innerHTML = '';
    if (!P[cur]) cur = 'ROOT';
    if (view === 'about') renderAbout(app);
    else if (view === 'link') renderLink(app);
    else if (view === 'tree') renderTree(app);
    else renderPerson(app);
  }

  $('whoBtn').onclick = () => { if (me) go(me); else openFinder('go'); };
  $('findBtn').onclick = () => openFinder('go');
  $('fclose').textContent = '×';
  $('fclose').setAttribute('aria-label', 'بستن');
  $('fclose').onclick = closeFinder;
  $('fq').addEventListener('input', drawFinder);
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    const v = $('docview');
    if (v && v.classList.contains('on')) { v.classList.remove('on'); return; }
    closeFinder();
  });
  function onRoute() {
    if (readHash()) { render(); restoreScroll(); }
  }
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('popstate', onRoute);

  readHash();
  render();
  if (!me) setTimeout(() => openFinder('go'), 400);

  return { go, render, openFinder, K };
}
